<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#16213A">
<title>Admin — Marblume</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts.css">
<style>
:root{--ink:#16213A;--paper:#F4EEE3;--bloom:#FF5A36;--leaf:#3F7A49;--muted:rgba(22,33,58,.62);--line:rgba(22,33,58,.1);--card:#fff;--shadow:0 1px 0 rgba(22,33,58,.06),0 1px 0 rgba(22,33,58,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.serif{font-family:'Fraunces',Georgia,serif;font-weight:800}
.hidden{display:none!important}
.muted{color:var(--muted)}
.field{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px}
.field:focus{outline:none;border-color:var(--bloom)}
textarea.field{min-height:90px;resize:vertical}
label.f{display:grid;gap:5px;font-weight:700;font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 16px;border-radius:12px;font-weight:700;font-size:14.5px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--bloom);color:#fff;box-shadow:0 1px 0 rgba(255,90,54,.25)}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.soft{background:rgba(22,33,58,.07)}
.btn.danger{color:#B23A20;background:rgba(255,90,54,.1)}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px}
.btn[disabled]{opacity:.6;cursor:default}
.wide{width:100%}
.err{color:#B23A20;font-weight:600;font-size:14px;margin-top:12px;min-height:20px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:7px;padding:2px 8px;background:rgba(22,33,58,.07);white-space:nowrap}
.pill.open,.pill.new{background:rgba(255,90,54,.14);color:#B23A20}.pill.answered,.pill.done{background:rgba(63,122,73,.15);color:var(--leaf)}.pill.closed,.pill.declined{background:rgba(22,33,58,.08);color:var(--muted)}
.pill.planned,.pill.in-progress{background:rgba(62,124,177,.14);color:#2D5F8B}.pill.bug{background:rgba(178,58,32,.12);color:#B23A20}.pill.idea{background:rgba(155,93,229,.14);color:#6B3FB0}

/* login */
#login{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:#16213A}
.lbox{width:100%;max-width:400px;background:var(--paper);border-radius:26px;padding:30px 24px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.lbox img{width:56px;height:56px;border-radius:14px;display:block;margin-bottom:16px}
.lbox h1{font-size:30px;line-height:1.1}
.lbox p{margin:6px 0 20px}
.check{display:flex;gap:10px;align-items:center;margin:14px 0 18px;font-size:14.5px}
.check input{width:20px;height:20px;accent-color:var(--bloom)}
.lhome{display:block;text-align:center;margin-top:16px;font-weight:600;color:var(--muted)}

/* shell */
#app{height:100%;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:10px max(14px,env(safe-area-inset-left));background:var(--ink);color:var(--paper)}
.top img{width:34px;height:34px;border-radius:9px}
.top h1{font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .btn{min-height:38px;padding:7px 12px;font-size:14px;background:rgba(244,238,227,.12);color:var(--paper)}
.tabs{flex:none;display:flex;gap:6px;overflow-x:auto;padding:10px max(14px,env(safe-area-inset-left));background:#FBF8F2;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:8px 13px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);background:rgba(22,33,58,.05)}
.tabs button.on{background:var(--ink);color:var(--paper)}
.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bloom);color:#fff;font-size:11px;margin-left:4px;line-height:18px}
.view{flex:1;min-height:0;overflow-y:auto}
.page{max-width:1100px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) 40px}
.page h2{font-size:26px;line-height:1.15}
.page .intro{color:var(--muted);margin:4px 0 16px;max-width:720px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--min,200px),1fr));gap:12px}
.form{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:640px){.two,.three{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.stat b{display:block;font-family:'Fraunces',serif;font-size:28px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:minmax(80px,140px) 1fr 40px;gap:10px;align-items:center;font-size:14px;margin:6px 0}
.hbar i{display:block;height:10px;border-radius:6px;background:var(--bloom)}
.hbar .track{background:rgba(22,33,58,.07);border-radius:6px}
.vchart{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px}
.vchart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);height:100%;justify-content:flex-end}
.vchart i{display:block;width:100%;background:var(--ink);border-radius:6px 6px 2px 2px;min-height:3px}
.item{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.item h3{font-size:16px;font-family:'DM Sans',sans-serif;font-weight:700}
.item p{color:var(--muted);font-size:14px;white-space:pre-wrap;margin-top:4px}
.ck{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.ck:last-child{border:0}
.ck input[type=checkbox]{width:22px;height:22px;accent-color:var(--leaf);flex:none;margin-top:2px}
.ck .t{flex:1;min-width:0}
.ck .field{margin-top:6px;padding:7px 10px;font-size:14px}
.health li{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.health li:last-child{border:0}
.ok{color:var(--leaf);font-weight:800}.no{color:#B23A20;font-weight:800}
.progress{height:10px;border-radius:6px;background:rgba(22,33,58,.08);overflow:hidden;margin:8px 0 4px}.progress i{display:block;height:100%;background:var(--leaf)}

/* inbox */
.layout{height:100%;display:grid;grid-template-columns:minmax(300px,380px) 1fr}
.pane{min-height:0;display:flex;flex-direction:column}
.listpane{border-right:1px solid var(--line);background:#FBF8F2}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 14px 6px}
.stats .stat{background:var(--card);border-radius:14px;padding:10px;box-shadow:var(--shadow);text-align:left}
.stats .stat b{font-size:22px}.stats .stat span{font-size:12px}
.stats .stat.on{outline:2px solid var(--bloom)}
.tools{display:flex;gap:8px;padding:8px 14px 10px}
.tools .field{padding:10px 12px;font-size:15px}
.list{flex:1;min-height:0;overflow-y:auto;padding:0 10px 16px}
.titem{display:block;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:12px 14px;margin-top:8px;box-shadow:var(--shadow);border:2px solid transparent}
.titem.sel{border-color:var(--ink)}
.titem .r1{display:flex;align-items:center;gap:8px}
.titem .who{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem .when{font-size:12px;color:var(--muted);white-space:nowrap}
.titem .prev{font-size:14px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.titem.unread .who:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bloom);margin-right:7px;vertical-align:1px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.convpane{background:var(--paper)}
.chead{flex:none;padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;background:#FBF8F2}
.chead .back{display:none;width:40px;height:40px;border-radius:12px;background:rgba(22,33,58,.07);flex:none;align-items:center;justify-content:center}
.chead h2{font-size:22px;line-height:1.15;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin-top:4px}
.meta a{color:var(--ink);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.actions .btn,.actions select{min-height:36px;padding:6px 11px;font-size:13.5px}
.actions select{border:1.5px solid var(--line);border-radius:12px;background:#fff}
.notes{margin-top:10px;display:grid;gap:6px}
.notes textarea{min-height:56px;font-size:14px;background:#FFFBEA;border-color:#EADFB4}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.bub{max-width:min(620px,86%);padding:12px 14px;border-radius:18px;box-shadow:var(--shadow);white-space:pre-wrap;word-break:break-word}
.bub.user{background:#fff;align-self:flex-start;border-bottom-left-radius:6px}
.bub.admin{background:var(--ink);color:var(--paper);align-self:flex-end;border-bottom-right-radius:6px}
.bub small{display:block;font-size:11.5px;opacity:.65;margin-top:6px}
.composer{flex:none;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#FBF8F2;display:grid;gap:8px}
.composer .rowc{display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1;min-height:52px;max-height:200px;resize:vertical;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px}
.composer textarea:focus{outline:none;border-color:var(--bloom)}
.composer select{border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:6px 10px;font-size:13.5px;max-width:100%}
.hint{font-size:12.5px;color:var(--muted)}
.placeholder{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}
.placeholder img{width:72px;height:72px;border-radius:18px;opacity:.85;margin:0 auto 12px;display:block}
/* pagination, tables, segmented control */
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:12px 0 4px;font-size:13.5px}
.pager .pg{display:flex;align-items:center;gap:6px}
.pager button{min-height:36px;min-width:40px;padding:6px 12px;border-radius:10px;background:rgba(22,33,58,.07);font-weight:700}
.pager button[disabled]{opacity:.4;cursor:default}
.pager select{border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:6px 8px;font-size:13px}
.list .pager{margin:12px 4px 4px}
.tbl-wrap{overflow-x:auto;border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;background:#FBF8F2}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#FBF8F2}
.tbl tr:last-child td{border-bottom:0}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.seg2{display:inline-flex;background:rgba(22,33,58,.07);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg2 button{padding:7px 14px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg2 button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.bar2{display:grid;grid-template-columns:minmax(70px,130px) 1fr auto;gap:10px;align-items:center;font-size:14px;margin:6px 0}
.bar2 .track{background:rgba(22,33,58,.07);border-radius:6px;height:10px;overflow:hidden}.bar2 .track i{display:block;height:100%;background:var(--bloom);border-radius:6px}
.bar2 b{font-variant-numeric:tabular-nums}
.stars5{color:#C2412A;letter-spacing:1px}
.note{background:#FFFBEA;border:1px solid #EADFB4;border-radius:12px;padding:10px 12px;font-size:13.5px}
.sheetbg{position:fixed;inset:0;background:rgba(22,33,58,.5);z-index:8;display:flex;align-items:flex-end;justify-content:center}
.sheetbox{background:var(--paper);width:100%;max-width:900px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-left)) calc(18px + env(safe-area-inset-bottom))}
@media(min-width:760px){.sheetbg{align-items:center}.sheetbox{border-radius:22px;max-height:88vh}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:calc(100% - 32px)}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .listpane{border-right:0}
  .convpane{display:none}
  body.reading .listpane{display:none}
  body.reading .convpane{display:flex}
  .chead .back{display:inline-flex}
  .top .txt{display:none}
}
@media (max-width:380px){.stats .stat b{font-size:19px}.top h1{font-size:17px}}
/* phones and short screens: the conversation header scrolls away with the messages; the reply box stays pinned */
@media (max-width:820px),(max-height:700px){
  .convpane{overflow-y:auto;overscroll-behavior:contain}
  .convpane .chead,.convpane .msgs{flex:none}
  .convpane .msgs{overflow:visible;min-height:auto}
  .convpane .composer{position:sticky;bottom:0;z-index:2;margin-top:auto}
  .notes textarea{min-height:44px}
}
</style>
</head>
<body>

<section id="login">
  <form class="lbox" id="loginForm" autocomplete="on">
    <img src="/icon-512.png" alt="">
    <h1 class="serif">Marblume admin</h1>
    <p class="muted">Sign in to answer players and manage the game’s support tools.</p>
    <input class="field" id="key" type="password" name="password" autocomplete="current-password" placeholder="Admin key" aria-label="Admin key" required>
    <label class="check"><input type="checkbox" id="remember"> Keep me signed in on this device</label>
    <button class="btn primary wide" id="signin">Sign in</button>
    <div class="err" id="loginErr" role="alert"></div>
    <a class="lhome" href="/">← Back to the website</a>
  </form>
</section>

<div id="app" class="hidden">
  <header class="top">
    <img src="/icon-512.png" alt="">
    <h1 class="serif">Admin <span class="txt" style="color:rgba(244,238,227,.6);font-family:'DM Sans';font-weight:500;font-size:14px">· Marblume</span></h1>
    <a class="btn" href="/" title="Go to the website home page">⌂ <span class="txt">Home</span></a>
    <button class="btn" id="refresh" title="Refresh">↻ <span class="txt">Refresh</span></button>
    <button class="btn" id="signout">Sign out</button>
  </header>
  <nav class="tabs" id="tabs" aria-label="Admin sections"></nav>
  <main class="view" id="view"></main>
</div>
<div id="toast" role="status"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const when = (iso) => { const d = new Date(iso), n = new Date(); return d.toDateString() === n.toDateString() ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : d.toLocaleDateString([], { day: 'numeric', month: 'short' }); };
  const full = (iso) => new Date(iso).toLocaleString([], { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const toast = (t) => { const e = $('toast'); e.textContent = t; e.style.opacity = 1; clearTimeout(e._h); e._h = setTimeout(() => (e.style.opacity = 0), 2400); };
  const LABELS = [['', 'No label'], ['bug', 'Bug'], ['idea', 'Idea'], ['question', 'Question'], ['praise', 'Praise'], ['account', 'Progress / device'], ['other', 'Other']];
  const TABS = [['inbox', 'Inbox'], ['players', 'Players'], ['surveys', 'Surveys'], ['dashboard', 'Dashboard'], ['ideas', 'Ideas & bugs'], ['replies', 'Saved replies'], ['faq', 'FAQ'], ['announce', 'Announcement'], ['releases', 'Releases'], ['checklist', 'Store checklist'], ['privacy', 'Privacy tools']];
  let KEY = '', tab = 'inbox', tickets = [], counts = {}, filter = 'all', current = null, timer = null, replies = [], ipage = 1, ipages = 1, itotal = 0, iq = '', isize = 25;
  // ---------- pagination ----------
  // pager(id, page, pages, total, size) -> HTML; its buttons call PAGERS[id](newPage, newSize)
  const PAGERS = {};
  const pager = (id, page, pages, total, size) => (pages <= 1 && total <= 10) ? '' : `<div class="pager" data-pager="${id}"><span class="muted">${Number(total).toLocaleString()} total</span>
    <span class="pg"><button data-go="${page - 1}" ${page <= 1 ? 'disabled' : ''} aria-label="Previous page">‹</button><span>Page <b>${page}</b> of ${pages}</span><button data-go="${page + 1}" ${page >= pages ? 'disabled' : ''} aria-label="Next page">›</button></span>
    <select data-size aria-label="Rows per page">${[10, 25, 50, 100].map((n) => `<option value="${n}" ${n === size ? 'selected' : ''}>${n} per page</option>`).join('')}</select></div>`;
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-pager] [data-go]'); if (!b || b.disabled) return; PAGERS[b.closest('[data-pager]').dataset.pager]?.(+b.dataset.go); });
  document.addEventListener('change', (e) => { const sel = e.target.closest('[data-pager] [data-size]'); if (sel) PAGERS[sel.closest('[data-pager]').dataset.pager]?.(1, +sel.value); });
  function domPage(gridId, key, size = 12) {
    const g = $(gridId); if (!g) return; const items = [...g.children].filter((c) => c.classList.contains('item')); const st = LOCAL[key] || (LOCAL[key] = { page: 1, size });
    const pages = Math.max(1, Math.ceil(items.length / st.size)); st.page = Math.min(st.page, pages);
    items.forEach((el, i) => el.classList.toggle('hidden', i < (st.page - 1) * st.size || i >= st.page * st.size));
    g.nextElementSibling?.matches('.pager') && g.nextElementSibling.remove(); g.insertAdjacentHTML('afterend', pager(key, st.page, pages, items.length, st.size));
    PAGERS[key] = (p, sz) => { if (sz) st.size = sz; st.page = Math.max(1, p); domPage(gridId, key); };
  }
  // pages for short lists that are loaded whole (ideas, saved replies, FAQ, releases)
  const LOCAL = {};
  function localPage(key, items, render, size = 12) {
    const st = LOCAL[key] || (LOCAL[key] = { page: 1, size }); const pages = Math.max(1, Math.ceil(items.length / st.size)); st.page = Math.min(st.page, pages);
    PAGERS[key] = (p, sz) => { if (sz) st.size = sz; st.page = Math.max(1, Math.min(p, Math.ceil(items.length / st.size))); render(); };
    return { rows: items.slice((st.page - 1) * st.size, st.page * st.size), pager: pager(key, st.page, pages, items.length, st.size) };
  }
  const store = { get: () => { try { return localStorage.getItem('mb.admin') || sessionStorage.getItem('mb.admin') || ''; } catch { return ''; } },
    set: (k, keep) => { try { (keep ? localStorage : sessionStorage).setItem('mb.admin', k); } catch {} },
    clear: () => { try { localStorage.removeItem('mb.admin'); sessionStorage.removeItem('mb.admin'); } catch {} } };

  async function api(path, opts = {}) {
    const r = await fetch('/api/admin/' + path, { ...opts, headers: { 'x-admin-key': KEY, 'content-type': 'application/json', ...(opts.headers || {}) } });
    const j = await r.json().catch(() => ({ ok: false, error: 'Network error' }));
    if (r.status === 401 || r.status === 429) { if (KEY) signOut(j.error); throw new Error(j.error); }
    if (!j.ok) throw new Error(j.error || 'Something went wrong');
    return j;
  }
  const post = (path, data) => api(path, { method: 'POST', body: JSON.stringify(data) });
  const del = (path) => api(path, { method: 'DELETE' });

  // ---------- sign in / out ----------
  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault(); $('loginErr').textContent = ''; $('signin').disabled = true; $('signin').textContent = 'Signing in…';
    const k = $('key').value.trim();
    try { const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'x-admin-key': k } }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Wrong admin key.'); KEY = k; store.set(k, $('remember').checked); start(); }
    catch (err) { $('loginErr').textContent = err.message; }
    $('signin').disabled = false; $('signin').textContent = 'Sign in';
  });

  async function surveyAnswers(id, pg, size = 20) {

    $('svAnswers').innerHTML = `<div class="card" style="margin-top:16px"><div class="row between"><h3 class="serif" style="font-size:20px">${esc(sv.question)}</h3><span class="row"><button class="btn soft sm" id="svCsv">Download CSV</button><button class="btn soft sm" id="svClose">Close</button></span></div>
      <div class="grid" style="--min:140px;margin:12px 0">${[[num(S.total), 'answers'], [S.avg != null ? S.avg + ' ★' : '—', 'average rating'], [num(S.comments), 'with a comment']].map(([b, t]) => `<div class="card stat"><b>${b}</b><span>${t}</span></div>`).join('')}</div>
      ${sv.kind !== 'text' ? `<b>Answers</b>${bars2(dist, (r) => `${num(r.n)} · ${pct(r.n, S.total)}`)}` : ''}<b style="display:block;margin-top:10px">By platform</b>${bars2(S.byPlatform)}

      ${pager('answers', j.page, j.pages, j.total, j.size)}</div>`;
    PAGERS.answers = (p, sz) => surveyAnswers(id, Math.max(1, Math.min(p, sz ? 1 : j.pages)), sz || j.size);

    $('view').querySelectorAll('[data-key]').forEach((cb) => (cb.onchange = async () => { await save(cb.dataset.key); viewChecklist(); }));
    $('view').querySelectorAll('[data-note]').forEach((n) => { let t; n.oninput = () => { clearTimeout(t); t = setTimeout(() => save(n.dataset.note), 800); }; });
    $('runHealth').onclick = async () => { $('health').innerHTML = '<li class="muted">Checking…</li>'; try { const h = await api('health'); $('health').innerHTML = h.checks.map((c) => `<li><span class="${c.pass ? 'ok' : 'no'}">${c.pass ? '✓' : '✗'}</span><span>${esc(c.text)}</span></li>`).join('') + `<li class="muted" style="font-size:12.5px">Website version ${esc(h.version)} · checked ${when(h.checked)}</li>`; } catch (e) { $('health').innerHTML = `<li class="no">${esc(e.message)}</li>`; } };
  }

  // =================== 11. PRIVACY TOOLS ===================
  function viewPrivacy() {
    page('Privacy tools', 'Look after the messages players send, as your privacy policy promises.', `
      <div class="grid" style="--min:300px">
        <div class="card form"><b>Export all conversations</b><p class="muted" style="font-size:14px">Download every conversation and message as a spreadsheet (CSV) — for your records or a backup.</p><div><button class="btn dark" id="exp">Download CSV</button></div></div>
        <div class="card form"><b>Delete a player’s data</b><p class="muted" style="font-size:14px">If someone asks you to delete their messages, enter their email address. Every conversation with that email is deleted permanently.</p>
          <input class="field" id="eraseEmail" type="email" placeholder="player@example.com" autocomplete="off"><div><button class="btn danger" id="erase">Delete everything from this email</button></div></div>
        <div class="card"><b>Automatic clean-up</b><p class="muted" style="font-size:14px;margin-top:6px">Conversations are deleted automatically 12 months after their last message, and anonymous game stats and survey answers after 24 months, as the privacy policy says. Players can delete their own stats in the game (Settings → Delete my shared stats); you can delete one player's data from the Players tab.</p></div>
      </div>`);
    $('exp').onclick = async () => { try { const r = await fetch('/api/admin/export', { headers: { 'x-admin-key': KEY } }); if (!r.ok) throw new Error('Export failed'); const b = await r.blob(); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `marblume-support-${new Date().toISOString().slice(0, 10)}.csv`; a.click(); URL.revokeObjectURL(a.href); toast('Downloaded'); } catch (e) { toast(e.message); } };
    $('erase').onclick = async () => { const email = $('eraseEmail').value.trim(); if (!email) return; if (!confirm(`Permanently delete every conversation from ${email}?`)) return; try { const r = await post('erase', { email }); toast(`Deleted ${r.deleted} conversation${r.deleted === 1 ? '' : 's'}`); $('eraseEmail').value = ''; } catch (e) { toast(e.message); } };
  }

  addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.body.classList.contains('reading') && matchMedia('(max-width: 820px)').matches) $('back')?.click(); });
  const saved = store.get(); if (saved) { KEY = saved; fetch('/api/admin/login', { method: 'POST', headers: { 'x-admin-key': saved } }).then((r) => (r.ok ? start() : signOut())); }
})();
</script>
</body>
