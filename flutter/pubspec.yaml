name: marblume_flutter
description: "Marblume: a hard, calm ball-sort puzzle (Flutter version)."
publish_to: 'none'
version: 1.11.0+15

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/levels.json   # copied from ../www/levels.json before building (see README)

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../assets/icon-only.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#16213A"
  adaptive_icon_foreground: "../assets/icon-foreground.png"
