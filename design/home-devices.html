<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marblume Home Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=Fraunces:opsz,wght@9..144,800;9..144,900&display=swap" rel="stylesheet">
<style>
/* Design concept only: the Marblume start screen on Android, iPhone, iPad and the web. Solid colours, no gradients. */
:root{
  --night:#0B1222;--navy:#16213A;--deep:#070C18;--line:rgba(239,233,221,.1);--line2:rgba(239,233,221,.18);
  --cream:#F4EEE3;--soft:rgba(244,238,227,.64);--bloom:#FF5A36;--bloom-deep:#C8442A;--leaf:#6BAA75;--gold:#E9B44C;
  --glass:rgba(34,48,90,.55);--rim:rgba(255,255,255,.14);--page:#05080F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--cream);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.serif{font-family:'Fraunces',Georgia,serif}

/* ---------- gallery ---------- */
.gallery-head{position:sticky;top:0;z-index:20;background:var(--page);border-bottom:1px solid var(--line);padding:14px 16px}
.gallery-head .in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:'Fraunces',serif;font-weight:900;font-size:22px;margin-right:auto}
.brand span{color:var(--bloom)}
.seg{display:flex;gap:4px;padding:4px;border-radius:99px;background:var(--navy);box-shadow:0 0 0 1px var(--line)}
.seg button{padding:8px 16px;border-radius:99px;font-weight:700;font-size:14px;color:var(--soft)}
.seg button[aria-pressed=true]{background:var(--cream);color:var(--navy)}
.stage-area{max-width:1400px;margin:0 auto;padding:28px 16px 60px;display:flex;flex-wrap:wrap;gap:40px 32px;justify-content:center;align-items:flex-end}
.device{display:flex;flex-direction:column;align-items:center;gap:14px}
.device[hidden]{display:none}
.device figcaption{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.fit{zoom:var(--z,1)}

/* ---------- device frames ---------- */
.phone{position:relative;border-radius:52px;padding:12px;background:#1B1F27;box-shadow:inset 0 0 0 2px #2C323D,0 0 0 1px #000}
.phone.android{border-radius:40px;padding:10px}
.screen{position:relative;overflow:hidden;background:var(--night);container-type:inline-size;isolation:isolate}
.phone .screen{border-radius:42px}.phone.android .screen{border-radius:32px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:30}
.punch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:#000;box-shadow:0 0 0 2px #1B1F27;z-index:30}
.status{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-weight:700;font-size:15px;z-index:25}
.android .status{height:36px;padding:0 22px;font-size:13px}
.status .ic{display:flex;gap:6px;align-items:center}
.status .ic i{display:block;background:var(--cream);border-radius:2px}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:9px;background:var(--cream);z-index:30}
.android .homebar{width:110px;height:4px;bottom:7px}
.tablet{border-radius:34px;padding:16px;background:#1B1F27;box-shadow:inset 0 0 0 2px #2C323D}
.tablet .screen{border-radius:20px}
.browser{border-radius:14px;overflow:hidden;background:#1B1F27;box-shadow:0 0 0 1px #2C323D}
.bar{height:44px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#1B1F27}
.dots{display:flex;gap:7px}.dots i{width:12px;height:12px;border-radius:50%;background:#3A404C}
.dots i:nth-child(1){background:#FF5F57}.dots i:nth-child(2){background:#FEBC2E}.dots i:nth-child(3){background:#28C840}
.url{flex:1;max-width:520px;margin:0 auto;height:28px;border-radius:8px;background:#0F131A;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13px;color:var(--soft)}
.url b{color:var(--cream);font-weight:500}

/* ================= THE HOME SCREEN (adapts to its own width) ================= */
.home{position:absolute;inset:0;overflow:auto;scrollbar-width:none;padding:var(--top,58px) 16px 110px;display:grid;gap:14px;align-content:start}
.home::-webkit-scrollbar{display:none}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 1px 0 var(--rim),0 0 0 1px var(--line)}
.label{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.split{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* player */
.top{display:flex;align-items:center;gap:12px}
.av{position:relative;width:52px;height:52px;flex:none}
.av svg{width:100%;height:100%;border-radius:50%;background:#DDF0E4;box-shadow:0 0 0 3px var(--night),0 0 0 6px var(--bloom)}
.av b{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);background:var(--bloom);color:var(--navy);font-size:11px;font-weight:800;padding:1px 7px;border-radius:99px;box-shadow:0 0 0 2px var(--night)}
.who{flex:1;min-width:0}
.who strong{display:block;font-size:17px;line-height:1.2}
.rank{display:flex;align-items:center;gap:8px;margin-top:5px}
.rank span{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--gold)}
.xp{flex:1;max-width:140px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.xp i{display:block;height:100%;width:62%;background:var(--gold)}
.chips{display:flex;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;font-weight:800;font-size:14px;white-space:nowrap}
.dot{width:14px;height:14px;border-radius:50%;box-shadow:inset -3px -3px 0 rgba(0,0,0,.22)}
.icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.icon svg,.tabs svg,.rail svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon svg{width:20px;height:20px}
.chip.stars{display:none}

/* stage: the next level */
.stage{position:relative;border-radius:28px;background:var(--navy);padding:18px 18px 16px;box-shadow:inset 0 1px 0 var(--rim),0 0 0 1px var(--line),0 4px 0 var(--deep)}
.lvl{font-size:56px;line-height:.95;letter-spacing:-.03em;margin-top:6px}
.lvl small{font:800 16px 'DM Sans',sans-serif;letter-spacing:.08em;color:var(--soft);margin-right:6px;vertical-align:16px}
.boss{background:#2A1A20;color:var(--bloom);box-shadow:inset 0 0 0 1.5px var(--bloom);border-radius:12px;padding:6px 10px;font-size:10px;font-weight:800;letter-spacing:.12em;text-align:center;line-height:1.3;flex:none}
.boss b{display:block;font:900 22px 'Fraunces',serif;letter-spacing:0;color:var(--cream)}
.board{display:flex;justify-content:center;gap:var(--g,9px);flex-wrap:wrap;padding:30px 0 16px;row-gap:24px}
.tube{--bs:24px;position:relative;width:calc(var(--bs) + 10px);padding:4px 0;border:2.5px solid var(--line2);border-top:0;border-radius:0 0 99px 99px;background:rgba(255,255,255,.05);display:flex;flex-direction:column-reverse;align-items:center;gap:3px;min-height:calc(3 * (var(--bs) + 3px) + 12px);
  box-shadow:inset 4px 0 0 rgba(255,255,255,.1),inset -5px 0 0 rgba(0,0,0,.2),0 5px 0 -1px rgba(0,0,0,.4)}
.tube:before{content:"";position:absolute;top:-5px;left:-5px;right:-5px;height:10px;border-radius:50%;border:2.5px solid var(--line2);background:var(--navy)}
.tube:after{content:"";position:absolute;left:5px;top:9px;bottom:12px;width:4px;border-radius:9px;background:rgba(255,255,255,.16)}
.ball{--c:#888;position:relative;width:var(--bs);height:var(--bs);border-radius:50%;background:var(--c);box-shadow:inset calc(var(--bs) * -.12) calc(var(--bs) * -.16) 0 rgba(0,0,0,.24),0 2px 0 rgba(0,0,0,.35)}
.ball:after{content:"";position:absolute;left:21%;top:16%;width:34%;height:22%;border-radius:50%;background:rgba(255,255,255,.72);transform:rotate(-30deg)}
.ball.lift{transform:translateY(calc(var(--bs) * -.95));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(calc(var(--bs) * -1.15))}}
.ball.hid{--c:#33405E}.ball.hid:before{content:"?";position:absolute;inset:0;display:grid;place-items:center;font:800 calc(var(--bs) * .5) 'Fraunces',serif;color:var(--soft)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:14px}
.fact{text-align:center}.fact+.fact{border-left:1px solid var(--line)}
.fact b{display:block;font:900 22px 'Fraunces',serif;line-height:1.1}
.fact span{font-size:10px;font-weight:800;color:var(--soft);letter-spacing:.12em;text-transform:uppercase}
.meter{display:flex;gap:4px;justify-content:center;margin:7px 0 5px}
.meter i{width:14px;height:6px;border-radius:2px;background:var(--line)}.meter i.on{background:var(--gold)}
.reward{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);font-size:13px;font-weight:700}
.reward .fl{width:26px;height:26px;flex:none}
.reward .pips{margin-left:auto;display:flex;gap:4px}
.reward .pips i{width:8px;height:8px;border-radius:50%;background:var(--line2)}.reward .pips i.on{background:var(--leaf)}

/* play */
.play{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;height:70px;border-radius:22px;background:var(--bloom);color:var(--navy);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 0 var(--bloom-deep);transition:transform .08s,box-shadow .08s}
.play:active{transform:translateY(5px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 0 var(--bloom-deep)}
.play svg{width:24px;height:24px;fill:var(--navy)}
.play span{font-weight:800;font-size:22px;letter-spacing:.08em;text-align:left;line-height:1.05}
.play small{display:block;font-size:11px;letter-spacing:.16em;opacity:.7}

/* side cards */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border-radius:22px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .1s}
.card:active{transform:scale(.97)}
.card h3{font:900 18px 'Fraunces',serif;line-height:1.15}
.card p{font-size:12px;color:var(--soft);line-height:1.35}
.tag{align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.14em;padding:4px 8px;border-radius:6px}
.tag.live{background:var(--bloom);color:var(--navy)}.tag.x2{background:var(--gold);color:var(--navy)}.tag.new{background:var(--leaf);color:var(--navy)}
.timer{font:900 24px 'Fraunces',serif;line-height:1;font-variant-numeric:tabular-nums}
.streak{display:flex;gap:4px}.streak i{flex:1;height:8px;border-radius:3px;background:var(--line)}.streak i.on{background:var(--bloom)}
.toggle{width:46px;height:28px;border-radius:99px;background:var(--line2);position:relative;flex:none}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--cream)}

/* more ways to play: Zen, All levels, My results */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{border-radius:18px;padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .1s}
.mode:active{transform:scale(.96)}
.mode .mi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.mode .mi svg{width:19px;height:19px;fill:none;stroke:var(--navy);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mode b{font-size:14px;line-height:1.2}
.mode span{font-size:11px;color:var(--soft);line-height:1.3}

/* world path */
.path{border-radius:22px;padding:14px 16px}
.track{display:flex;align-items:center;margin-top:14px}
.node{min-width:30px;height:30px;padding:0 4px;border-radius:99px;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;background:var(--line);color:var(--soft)}
.node.done{background:var(--leaf);color:var(--navy)}
.node.cur{min-width:40px;height:40px;background:var(--bloom);color:var(--navy);font-size:13px;box-shadow:0 0 0 4px rgba(255,90,54,.25)}
.node.boss{border-radius:10px;background:#2A1A20;color:var(--bloom);box-shadow:inset 0 0 0 1.5px var(--bloom);padding:0 7px}
.line{flex:1;height:4px;background:var(--line)}.line.done{background:var(--leaf)}

/* extra panels for wide screens */
.wide-only{display:none}
.garden{border-radius:22px;padding:14px 16px}
.beds{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:12px}
.beds svg{width:100%;aspect-ratio:1}
.badges{border-radius:22px;padding:14px 16px}
.medals{display:flex;gap:8px;margin-top:12px}
.medal{flex:1;aspect-ratio:1;border-radius:14px;display:grid;place-items:center;background:var(--line)}
.medal svg{width:46%;height:46%;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.medal.got{background:var(--bloom)}.medal.got svg{stroke:var(--navy)}.medal:not(.got) svg{stroke:var(--soft)}

/* bottom tab bar (phones) */
.tabs{position:absolute;left:12px;right:12px;bottom:var(--tabb,26px);display:flex;padding:6px;border-radius:30px;z-index:10}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:24px;font-size:11px;font-weight:700;color:var(--soft)}
.tabs button.on{background:rgba(255,255,255,.08);color:var(--cream)}
.tabs svg{width:22px;height:22px}.tabs .on svg{stroke:var(--bloom)}
/* side rail (tablets and computers) */
.rail{display:none}

/* ---- tablets & computers: rail | next level | your progress ---- */
@container (min-width:900px){
  .home{grid-template-columns:96px minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:auto auto;gap:20px 22px;padding:var(--top,32px) 28px 28px 20px;overflow:hidden;align-content:center}
  .tabs{display:none}
  .rail{display:flex;grid-row:1 / span 2;flex-direction:column;align-items:stretch;gap:6px;padding:10px 8px;border-radius:30px;align-self:center}
  .rail .logo{display:grid;place-items:center;height:56px;margin-bottom:8px}
  .rail button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;border-radius:22px;font-size:12px;font-weight:700;color:var(--soft)}
  .rail button.on{background:rgba(255,255,255,.08);color:var(--cream)}.rail button svg{width:24px;height:24px}.rail .on svg{stroke:var(--bloom)}
  .top{grid-column:2 / span 2}
  .chip.stars{display:flex}
  .main{display:grid;gap:18px;align-content:start}
  .side{display:grid;gap:16px;align-content:start}
  .lvl{font-size:76px}
  .tube{--bs:34px}.board{--g:14px;padding:40px 0 22px;row-gap:34px}
  .wide-only{display:block}
  .cards{grid-template-columns:1fr 1fr}
}
@container (min-width:1200px){.tube{--bs:40px}.lvl{font-size:88px}}
@container (max-width:899px){.main,.side{display:contents}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="gallery-head"><div class="in">
  <div class="brand">Marblume <span>·</span> home</div>
  <div class="seg" role="group" aria-label="Show device">
    <button aria-pressed="true" data-show="all">All</button>
    <button aria-pressed="false" data-show="android">Android</button>
    <button aria-pressed="false" data-show="iphone">iPhone</button>
    <button aria-pressed="false" data-show="ipad">iPad</button>
    <button aria-pressed="false" data-show="web">Web</button>
  </div>
</div></header>

<main class="stage-area" id="area">
  <figure class="device" data-d="android" data-w="380">
    <div class="fit"><div class="phone android"><div class="punch"></div>
      <div class="screen" style="width:360px;height:780px;--top:48px;--tabb:22px"><div class="status"><span>9:41</span><span class="ic"><i style="width:14px;height:10px"></i><i style="width:16px;height:9px"></i></span></div><div class="slot"></div><div class="homebar"></div></div>
    </div></div>
    <figcaption>Android</figcaption>
  </figure>

  <figure class="device" data-d="ipad" data-w="1212">

    </div></div>
    <figcaption>iPad · landscape</figcaption>

      <div class="screen" style="width:1440px;height:860px;--top:28px"><div class="slot"></div></div>
    </div></div>

  </figure>
</main>

<template id="home">
  <div class="home">
    <nav class="rail glass" aria-label="Main">
      <div class="logo"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 14v16a5 5 0 0 0 10 0V14M22 10v20a5 5 0 0 0 10 0V10" fill="none" stroke="#F4EEE3" stroke-width="2.5" stroke-linecap="round"/><circle cx="13" cy="29" r="3.4" fill="#3E7CB1"/><circle cx="13" cy="21" r="3.4" fill="#E9B44C"/><circle cx="27" cy="29" r="3.4" fill="#E56B9F"/><circle cx="27" cy="21" r="3.4" fill="#2EC4B6"/><circle cx="27" cy="6" r="3.4" fill="#FF5A36"/></svg></div>

      <button><svg viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Journey</button>
      <button><svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><circle cx="18" cy="12" r="3"/><circle cx="12" cy="18" r="3"/><circle cx="6" cy="12" r="3"/></svg>Garden</button>
      <button><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6L5 8zM9 8a3 3 0 0 1 6 0"/></svg>Shop</button>
      <button><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile</button>
    </nav>

    <header class="top">
      <div class="av"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="24" cy="28" r="11" fill="#2A2E3A"/><circle cx="76" cy="28" r="11" fill="#2A2E3A"/><circle cx="50" cy="54" r="34" fill="#fff"/><ellipse cx="36" cy="51" rx="9" ry="11" fill="#2A2E3A" transform="rotate(-20 36 51)"/><ellipse cx="64" cy="51" rx="9" ry="11" fill="#2A2E3A" transform="rotate(20 64 51)"/><circle cx="37" cy="50" r="3.6" fill="#fff"/><circle cx="63" cy="50" r="3.6" fill="#fff"/><ellipse cx="50" cy="64" rx="5" ry="3.6" fill="#2A2E3A"/><path d="M44 71q6 5 12 0" stroke="#2A2E3A" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg><b>29</b></div>
      <div class="who"><strong>Amani</strong><div class="rank"><span>BLOOM</span><div class="xp"><i></i></div></div></div>
      <div class="chips">

<script>
// one home screen, placed in every device frame
const tpl = document.getElementById('home');
const FL = ['#E56B9F','#9B5DE5','#E9B44C','#2EC4B6','#3E7CB1','#FF5A36','#6BAA75','#C8A2D6','#6FB7D9'];
const flower = (c) => `<svg viewBox="0 0 26 26"><circle cx="13" cy="6" r="4.6" fill="${c}"/><circle cx="20" cy="13" r="4.6" fill="${c}"/><circle cx="13" cy="20" r="4.6" fill="${c}"/><circle cx="6" cy="13" r="4.6" fill="${c}"/><circle cx="13" cy="13" r="3.4" fill="#F4EEE3"/></svg>`;
document.querySelectorAll('.slot').forEach((s) => s.replaceWith(tpl.content.cloneNode(true)));
document.querySelectorAll('[data-beds]').forEach((b) => b.innerHTML = Array.from({ length: 18 }, (_, i) => flower(FL[i % FL.length])).join(''));

// the daily countdown ticks
let left = 6 * 3600 + 42 * 60 + 18;
const pad = (n) => String(n).padStart(2, '0');
setInterval(() => { left = Math.max(0, left - 1); const t = `${pad(left / 3600 | 0)}:${pad((left / 60 | 0) % 60)}:${pad(left % 60)}`; document.querySelectorAll('[data-timer]').forEach((e) => e.textContent = t); }, 1000);

// device picker, and each frame scaled to fit the window
const area = document.getElementById('area'), devices = [...document.querySelectorAll('.device')];
function fit() {
  const shown = devices.filter((d) => !d.hidden), avail = area.clientWidth - 32, hAvail = innerHeight - 150;
  const solo = shown.length === 1;
  shown.forEach((d) => {
    const w = +d.dataset.w, frame = d.querySelector('.fit');
    frame.style.setProperty('--z', 1);
    const h = frame.firstElementChild.offsetHeight;
    const target = solo ? Math.min(avail / w, hAvail / h, 1) : (d.dataset.d === 'android' || d.dataset.d === 'iphone' ? Math.min(avail / w, .62) : Math.min(avail / w, .5));
    frame.style.setProperty('--z', target.toFixed(3));
  });
}
document.querySelectorAll('[data-show]').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('[data-show]').forEach((x) => x.setAttribute('aria-pressed', x === b));
  devices.forEach((d) => d.hidden = b.dataset.show !== 'all' && d.dataset.d !== b.dataset.show);
  fit();
}));
addEventListener('resize', fit);
document.fonts.ready.then(fit); fit();
</script>
