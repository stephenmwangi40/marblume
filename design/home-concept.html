<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marblume Home Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=Fraunces:opsz,wght@9..144,800;9..144,900&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0B1222;--navy:#16213A;--navy2:#1E2B4A;--line:rgba(239,233,221,.1);
  --cream:#F4EEE3;--soft:rgba(244,238,227,.62);--bloom:#FF5A36;--bloom-deep:#C8442A;
  --leaf:#6BAA75;--gold:#E9B44C;--sky:#6FB7D9;
  --glass:rgba(34,48,90,.55);--rim:rgba(255,255,255,.14);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--night);color:var(--cream);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100dvh;padding:calc(14px + var(--st)) 16px calc(110px + var(--sb));display:flex;flex-direction:column;gap:14px}
.serif{font-family:'Fraunces',Georgia,serif}
.label{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 1px 0 var(--rim),0 0 0 1px var(--line)}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:12px}
.av{position:relative;width:52px;height:52px;flex:none}
.av .face{width:100%;height:100%;border-radius:50%;background:#DDF0E4;display:grid;place-items:center;font-size:28px;box-shadow:0 0 0 3px var(--night),0 0 0 6px var(--bloom)}
.av .lv{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--bloom);color:var(--navy);font-size:11px;font-weight:800;padding:1px 7px;border-radius:99px;box-shadow:0 0 0 2px var(--night)}
.who{flex:1;min-width:0}
.who b{display:block;font-size:17px;line-height:1.2}
.rank{display:flex;align-items:center;gap:8px;margin-top:5px}
.rank span{font-size:12px;font-weight:700;color:var(--gold)}
.xp{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.xp i{display:block;height:100%;width:62%;background:var(--gold)}
.chip{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;font-weight:800;font-size:14px}
.chip .seed{width:14px;height:14px;border-radius:50%;background:var(--leaf);box-shadow:inset -3px -3px 0 rgba(0,0,0,.2)}
.icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.icon svg{width:20px;height:20px;fill:none;stroke:var(--cream);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- the stage: next level ---------- */
.stage{position:relative;border-radius:28px;background:var(--navy);padding:18px 18px 20px;box-shadow:inset 0 1px 0 var(--rim),0 0 0 1px var(--line),0 4px 0 #070C18;overflow:hidden}
.stage-head{display:flex;justify-content:space-between;align-items:flex-start}
.lvl{font-size:56px;line-height:.95;letter-spacing:-.03em;margin-top:6px}
.lvl small{font-size:18px;letter-spacing:0;color:var(--soft);font-family:'DM Sans',sans-serif;font-weight:700;margin-right:4px;vertical-align:14px}
.boss{background:#2A1A20;color:var(--bloom);border:1.5px solid var(--bloom);border-radius:10px;padding:5px 9px;font-size:11px;font-weight:800;letter-spacing:.1em;text-align:center;line-height:1.3}
.boss b{display:block;font-size:18px;letter-spacing:0;color:var(--cream)}
/* 3D board preview */
.board{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;padding:28px 0 18px;row-gap:22px}
.tube{position:relative;width:34px;padding:4px 0;border:2.5px solid rgba(239,233,221,.32);border-top:0;border-radius:0 0 17px 17px;background:rgba(255,255,255,.06);display:flex;flex-direction:column-reverse;align-items:center;gap:3px;min-height:calc(3 * 25px + 14px);
  box-shadow:inset 4px 0 0 rgba(255,255,255,.12),inset -5px 0 0 rgba(0,0,0,.18),0 5px 0 -1px rgba(0,0,0,.35)}
.tube:before{content:"";position:absolute;top:-5px;left:-5px;right:-5px;height:10px;border-radius:50%;border:2.5px solid rgba(239,233,221,.32);background:var(--navy)}
.tube:after{content:"";position:absolute;left:5px;top:8px;bottom:12px;width:4px;border-radius:9px;background:rgba(255,255,255,.18)}
.ball{--c:#888;position:relative;width:24px;height:24px;border-radius:50%;background:var(--c);box-shadow:inset -3px -4px 0 rgba(0,0,0,.24),0 2px 0 rgba(0,0,0,.3)}
.ball:after{content:"";position:absolute;left:5px;top:4px;width:8px;height:5px;border-radius:50%;background:rgba(255,255,255,.7);transform:rotate(-30deg)}
.ball.lift{transform:translateY(-22px);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-27px)}}
.hid{--c:#3A4560}.hid:before{content:"?";position:absolute;inset:0;display:grid;place-items:center;font:800 12px 'Fraunces',serif;color:var(--soft)}
/* level facts */
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:14px}
.fact{text-align:center}
.fact+.fact{border-left:1px solid var(--line)}
.fact b{display:block;font-size:20px;font-family:'Fraunces',serif;line-height:1.1}
.fact span{font-size:11px;font-weight:700;color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
.meter{display:flex;gap:4px;justify-content:center;margin:6px 0 4px}
.meter i{width:14px;height:6px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--gold)}

/* ---------- play ---------- */
.play{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:68px;border-radius:22px;background:var(--bloom);color:var(--navy);font-weight:800;font-size:21px;letter-spacing:.06em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 0 var(--bloom-deep);transition:transform .08s,box-shadow .08s}
.play:active{transform:translateY(5px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 0 var(--bloom-deep)}
.play svg{width:22px;height:22px;fill:var(--navy)}
.play small{display:block;font-size:12px;letter-spacing:.12em;opacity:.75}

/* ---------- challenges ---------- */
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border-radius:22px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .1s}
.card:active{transform:scale(.97)}
.card h3{font-size:16px;line-height:1.2}
.card p{font-size:12px;color:var(--soft);line-height:1.35}
.streak{display:flex;gap:4px}
.streak i{flex:1;height:8px;border-radius:3px;background:var(--line)}
.streak i.on{background:var(--bloom)}
.tag{align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.12em;padding:3px 8px;border-radius:6px}
.tag.live{background:var(--bloom);color:var(--navy)}
.tag.x2{background:var(--gold);color:var(--navy)}
.timer{font-family:'Fraunces',serif;font-size:22px;line-height:1}
.toggle{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--cream)}
.split{display:flex;align-items:center;justify-content:space-between}

/* ---------- world path ---------- */
.path{border-radius:22px;padding:14px 16px}
.track{display:flex;align-items:center;margin-top:14px}
.node{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;background:var(--line);color:var(--soft)}
.node.done{background:var(--leaf);color:var(--navy)}
.node.cur{width:40px;height:40px;background:var(--bloom);color:var(--navy);font-size:13px;box-shadow:0 0 0 4px rgba(255,90,54,.25)}
.node.boss{width:auto;padding:0 7px;border-radius:10px;background:#2A1A20;color:var(--bloom);border:1.5px solid var(--bloom)}
.seg{flex:1;height:4px;background:var(--line)}
.seg.done{background:var(--leaf)}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:50%;bottom:calc(12px + var(--sb));transform:translateX(-50%);width:min(calc(100% - 24px),456px);display:flex;padding:6px;border-radius:30px;z-index:5}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:24px;font-size:11px;font-weight:700;color:var(--soft)}
.tabs button.on{background:rgba(255,255,255,.08);color:var(--cream)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs .on svg{stroke:var(--bloom)}

/* entrance */
.app>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.app>*:nth-child(2){animation-delay:.05s}.app>*:nth-child(3){animation-delay:.1s}.app>*:nth-child(4){animation-delay:.15s}.app>*:nth-child(5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:760px){.app{max-width:720px}.lvl{font-size:72px}}
</style>
</head>
<body>
<main class="app">

  <header class="top">
    <div class="av"><div class="face">🐼</div><span class="lv">29</span></div>
    <div class="who">
      <b>Amani</b>
      <div class="rank"><span>BLOOM</span><div class="xp"><i></i></div></div>
    </div>
    <div class="chip glass"><span class="seed"></span>2,040</div>
    <button class="icon glass" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>

  <section class="stage" aria-label="Next level">
    <div class="stage-head">
      <div>
        <div class="label">World 1 · Seedling</div>
        <h1 class="lvl serif"><small>LV</small>187</h1>
      </div>
      <div class="boss">BOSS IN<b>13</b></div>
    </div>
    <div class="board" aria-hidden="true">
      <div class="tube"><i class="ball" style="--c:#3E7CB1"></i><i class="ball" style="--c:#E9B44C"></i><i class="ball lift" style="--c:#E56B9F"></i></div>
      <div class="tube"><i class="ball" style="--c:#6BAA75"></i><i class="ball" style="--c:#E56B9F"></i><i class="ball" style="--c:#2EC4B6"></i></div>
      <div class="tube"><i class="ball hid"></i><i class="ball" style="--c:#9B5DE5"></i><i class="ball" style="--c:#3E7CB1"></i></div>
      <div class="tube"><i class="ball" style="--c:#E9B44C"></i><i class="ball" style="--c:#2EC4B6"></i><i class="ball" style="--c:#6BAA75"></i></div>
      <div class="tube"><i class="ball" style="--c:#9B5DE5"></i><i class="ball" style="--c:#6BAA75"></i></div>
      <div class="tube"><i class="ball" style="--c:#2EC4B6"></i></div>
      <div class="tube"></div>
    </div>
    <div class="facts">
      <div class="fact"><b>27</b><span>Par</span></div>
      <div class="fact"><div class="meter"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div><span>Very hard</span></div>
      <div class="fact"><b>11</b><span>Colours</span></div>
    </div>
  </section>

  <button class="play"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg><span>PLAY<small>LEVEL 187</small></span></button>

  <div class="row">
    <button class="card glass">
      <span class="tag live">DAILY</span>
      <div><div class="timer serif">06:42:18</div><p>left for today's board</p></div>
      <div class="streak" aria-label="6 day streak"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
      <p>6-day streak</p>
    </button>
    <button class="card glass">
      <span class="tag x2">×2 SEEDS</span>
      <h3 class="serif">Expert</h3>
      <p>No hints. No extra tubes. 5 undos.</p>
      <div class="split"><p>Off</p><span class="toggle"></span></div>
    </button>
  </div>

  <section class="path glass" aria-label="World progress">
    <div class="split"><span class="label">Seedling path</span><span class="label">187 / 500</span></div>
    <div class="track">
      <span class="node done">185</span><span class="seg done"></span>
      <span class="node done">186</span><span class="seg done"></span>
      <span class="node cur">187</span><span class="seg"></span>
      <span class="node">188</span><span class="seg"></span>
      <span class="node">189</span><span class="seg"></span>
      <span class="node boss">200</span>
    </div>
  </section>

</main>

<nav class="tabs glass" aria-label="Main">
  <button class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Play</button>
  <button><svg viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Journey</button>
  <button><svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><circle cx="18" cy="12" r="3"/><circle cx="12" cy="18" r="3"/><circle cx="6" cy="12" r="3"/></svg>Garden</button>
  <button><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/></svg>Ranks</button>
  <button><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6L5 8zM9 8a3 3 0 0 1 6 0"/></svg>Shop</button>
</nav>

</body>
</html>
