name: Build apps

# Builds every release file on GitHub's machines, so no computer is needed:
#   Android: signed .apk (website / sideload) and .aab (Google Play)
#   iOS:     .ipa for iPhone and iPad
# Push a tag like v1.7.0 (or run it by hand from the Actions tab) and the files are
# attached to a GitHub Release.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#       the upload key that signs every Android release (never commit the .jks itself)
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64   (optional)
#       with these the .ipa is signed for the App Store and sent to TestFlight;
#       without them an unsigned .ipa is built (install with AltStore / Sideloadly, which re-sign it)
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   (optional) also publish the website

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Skipped without the signing secrets (the APK/AAB can also be built locally, see README).
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - name: Build signed APK + AAB
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          npm ci && npm run sync
          mkdir -p android/keystore
          echo "$KEYSTORE" | base64 --decode > android/keystore/marblume-upload.jks
          printf 'storeFile=../keystore/marblume-upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            '${{ secrets.ANDROID_STORE_PASSWORD }}' '${{ secrets.ANDROID_KEY_ALIAS }}' '${{ secrets.ANDROID_KEY_PASSWORD }}' > android/keystore.properties
          (cd android && chmod +x gradlew && ./gradlew assembleRelease bundleRelease --no-daemon)
          V=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Marblume-$V.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/Marblume-$V.aab
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with: { name: android, path: out/* }

  ios:
    runs-on: macos-26
    env:
      SIGNED: ${{ secrets.ASC_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:web && npx cap sync ios
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Unsigned .ipa
        if: env.SIGNED != 'true'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p build/ipa/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/App.app build/ipa/Payload/
          (cd build/ipa && zip -qry "Marblume-$(node -p "require('../../package.json').version")-unsigned.ipa" Payload && rm -rf Payload)

      - name: Signed .ipa (App Store)
        if: env.SIGNED == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$KEY_B64" | base64 --decode > ~/private_keys/AuthKey_$KEY_ID.p8
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/private_keys/AuthKey_$KEY_ID.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Marblume.xcarchive \
            DEVELOPMENT_TEAM=$TEAM CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=$(( GITHUB_RUN_NUMBER + 100 )) \
            $AUTH archive
          xcodebuild -exportArchive -archivePath build/Marblume.xcarchive \
            -exportOptionsPlist ios/export/ExportOptions.plist -exportPath build/ipa $AUTH
          mv build/ipa/*.ipa "build/ipa/Marblume-$(node -p "require('./package.json').version").ipa"
          xcrun altool --upload-app -f build/ipa/*.ipa -t ios --apiKey $KEY_ID --apiIssuer $ISSUER

      - uses: actions/upload-artifact@v4
        with: { name: ios, path: build/ipa/*.ipa }

  # The Flutter version of the game (flutter/): signed APK + AAB, and an unsigned .ipa
  flutter-android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.7, channel: stable, cache: true }
      - name: Build
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          cp www/levels.json flutter/assets/levels.json
          cd flutter
          if [ "$HAS_KEY" = true ]; then
            echo "$KEYSTORE" | base64 --decode > android/upload.jks
            printf 'storeFile=../upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              '${{ secrets.ANDROID_STORE_PASSWORD }}' '${{ secrets.ANDROID_KEY_ALIAS }}' '${{ secrets.ANDROID_KEY_PASSWORD }}' > android/key.properties
          fi
          flutter pub get && flutter test
          flutter build apk --release && flutter build appbundle --release
          V=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk ../out/Marblume-Flutter-$V.apk
          cp build/app/outputs/bundle/release/app-release.aab ../out/Marblume-Flutter-$V.aab
      - uses: actions/upload-artifact@v4
        with: { name: flutter-android, path: out/* }

  flutter-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.7, channel: stable, cache: true }
      - name: Unsigned .ipa
        run: |
          cp www/levels.json flutter/assets/levels.json
          cd flutter
          flutter pub get
          flutter build ios --release --no-codesign
          V=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          mkdir -p ../out/Payload && cp -R build/ios/iphoneos/Runner.app ../out/Payload/
          (cd ../out && zip -qry "Marblume-Flutter-$V-unsigned.ipa" Payload && rm -rf Payload)
      - uses: actions/upload-artifact@v4
        with: { name: flutter-ios, path: out/*.ipa }

  release:
    needs: [android, ios, flutter-android, flutter-ios]
    if: ${{ !cancelled() && needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "Marblume $V" --notes "Android: Marblume-$V.apk (install directly) and Marblume-$V.aab (Google Play). iPhone & iPad: the .ipa file. The Marblume-Flutter-* files are the Flutter version of the game (installs next to the main app as Marblume F)."
          gh release upload "v$V" out/* --clobber

  website:
    needs: android
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_CF == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_CF == 'true'
        with: { node-version: 22, cache: npm }
      - uses: actions/download-artifact@v4
        if: env.HAS_CF == 'true'
        with: { name: android, path: release }
      - name: Build and publish
        if: env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm ci && npm run build:web && npm run deploy:site
